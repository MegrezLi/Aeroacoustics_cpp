name: C++ numerical validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - run: python -m pip install 'numpy>=1.26,<3'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAEROACOUSTICS_BUILD_TESTS=ON -DAEROACOUSTICS_TEST_FORTRAN=ON
      - run: cmake --build build -j 2
      - run: ctest --test-dir build --output-on-failure -j 2
  thread-sanitizer:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Keep ASLR within the virtual address range supported by GCC ThreadSanitizer.
      - run: sudo sysctl -w vm.mmap_rnd_bits=28
      - run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo -DAEROACOUSTICS_BUILD_TESTS=ON -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
      - run: cmake --build build-tsan --target performance_api_probe engineering_probe metrics_probe farm_probe trailing_edge_probe -j 2
      - run: ctest --test-dir build-tsan -L concurrency --output-on-failure
        env:
          TSAN_OPTIONS: halt_on_error=1
